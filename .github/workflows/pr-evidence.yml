name: PR implementation evidence
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
concurrency:
  group: pr-evidence-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
jobs:
  evidence:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute PR code with this write-capable token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-pr-evidence.mjs "$REPO" "$PR_NUMBER" --status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
